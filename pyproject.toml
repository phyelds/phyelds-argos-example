[tool.poetry]
name = "phyelds-argos-example"
version = "0.1.0"
description = "Aggregate robot-swarm examples with Phyelds and ARGoS, on foot-bots and mixed swarms"
authors = ["Gianluca Aguzzi <gianluca.aguzzi@unibo.it>"]
license = "Apache-2.0"
readme = "README.md"
packages = [{ include = "phyelds_argos_examples", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
phyelds = { git = "https://github.com/phyelds/phyelds.git", rev = "ba003715ff03b0b0034be480dc37e9660b304837" }
phyelds-argos = { git = "https://github.com/phyelds/phyelds.git", rev = "ba003715ff03b0b0034be480dc37e9660b304837", subdirectory = "packages/phyelds-argos" }

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pylint = "^3.0.0"
flake8 = "^7.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["argos: requires an installed ARGoS3 and a built plugin"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
